apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: my-app-vs
  namespace: demo-app
spec:
  hosts:
    - "my-app.internal"
  gateways:
    - my-app-gateway
  tls:
    - match:
        - port: 443
          sniHosts:
            - "my-app.internal"
      route:
        - destination:
            host: build-info.demo-app.svc.cluster.local
            port:
              number: 443
