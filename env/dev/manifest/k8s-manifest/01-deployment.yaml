apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-info
  namespace: demo-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: build-info }
  template:
    metadata:
      labels: { app: build-info }
      annotations:
        # bump/replace on config change so pods restart (or use Reloader / kustomize configMapGenerator hash)
        config-version: "1"
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: build-info
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: build-info }
      containers:
        - name: app
          image: asia-south1-docker.pkg.dev/stable-electron-506610-c6/data-engg/build-info:33ff3a1
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: build-info-config
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: tmp # writable scratch (HOME=/tmp) for gsutil state; root fs is read-only
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: 8443, scheme: HTTPS }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8443, scheme: HTTPS }
            periodSeconds: 5
            failureThreshold: 1
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: build-info-tls
---
apiVersion: v1
kind: Service
metadata:
  name: build-info
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: build-info
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: build-info-gsa@stable-electron-506610-c6.iam.gserviceaccount.com
  name: build-info
  namespace: demo-app
