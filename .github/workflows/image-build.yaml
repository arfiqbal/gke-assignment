name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-push.yaml"
  pull_request: # PRs only build (no push, no GCP auth)
    paths:
      - "app/**"
  workflow_dispatch:

# Default for every job: read-only. The job below adds id-token: write for Workload Identity Federation.
permissions:
  contents: read

# Only cancel superseded PR builds; never cancel a push to main or a tag build mid-push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Set these under Settings > Secrets and variables > Actions > Variables (none are secrets)
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/build-info

jobs:
  build-push:
    runs-on: ubuntu-latest # GitHub-hosted public runner
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # lets this job request a GitHub OIDC token (no secrets involved)
    steps:
      # 1. Clone
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Build metadata (becomes /app/build-info.json inside the image)
      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${SHORT_SHA}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 3. Keyless auth to Google Cloud (skipped on PRs)
      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # 4. Build (and push except on PRs)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.short_sha }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', env.IMAGE, steps.meta.outputs.version) || '' }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ steps.meta.outputs.short_sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image pushed"
            echo "- Image: \`${IMAGE}:${{ steps.meta.outputs.short_sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
